<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    :root { --bg: #fafafa; --fg: #111; --sub: #666; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #f5f5f5; --sub: #999; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      text-align: center;
      padding: 0 16px;
    }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin: 0 0 12px; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--sub); font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>안녕하세요. 첫 번째 페이지입니다.</p>
  </main>
</body>
</html>
